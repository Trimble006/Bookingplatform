services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: bookingplatform
    volumes:
      - pgdata:/var/lib/postgresql/data

  ml-noshow:
    build:
      context: .
      dockerfile: ml/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://booking:booking@postgres:5432/bookingplatform
      ML_MODEL_PATH: /app/artifacts/noshow-model.joblib
    volumes:
      - ml_artifacts:/app/artifacts
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  ml_artifacts:
